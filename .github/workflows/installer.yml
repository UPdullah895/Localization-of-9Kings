name: installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  package:
    strategy:
      matrix:
        include:
          - os: windows-latest
            file: 9Kings-Arabic.exe
            asset: 9Kings-Arabic-Windows.exe
          - os: ubuntu-22.04          # oldest supported glibc, so the binary runs on most distros
            file: 9Kings-Arabic
            asset: 9Kings-Arabic-Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller==6.22.3
      - run: python installer/package.py
      - run: dist/${{ matrix.file }} --self-check
        shell: bash
      - run: mv dist/${{ matrix.file }} dist/${{ matrix.asset }}
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
